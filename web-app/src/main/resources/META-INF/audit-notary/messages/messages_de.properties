category.incident-reports.transition.incident.submit=Zur Prüfung einreichen
category.incident-reports.stage.triage=Ersteinschätzung
category.incident-reports.stage.triage.guidance=Halten Sie fest, wann der Vorfall geschah, entdeckt wurde und bekannt wurde, wie schwer er ist und welche Dienste er betrifft. Die beiden Antworten zu personenbezogenen Daten und NIS2 bestimmen, welche Fristen gelten.
category.incident-reports.stage.privacy-assessment=Datenschutzbewertung
category.incident-reports.stage.privacy-assessment.guidance=Beschreiben Sie die Betroffenen als Kategorien mit ungefähren Zahlen, bewerten Sie das Risiko für sie und entscheiden Sie, ob die Behörde und die Betroffenen informiert werden.
category.incident-reports.stage.response=Reaktion
category.incident-reports.stage.response.guidance=Halten Sie die ergriffenen Maßnahmen, den Ablauf und den Zeitpunkt der Behebung fest. Nennen Sie Rollen und Ticketnummern, keine Personen.
category.incident-reports.stage.notifications=Meldungen
category.incident-reports.stage.notifications.guidance=Erfassen Sie jede gesendete Meldung mit Zeitpunkt, Empfänger und Kanal. Die Fristen lesen den Zeitpunkt.
category.incident-reports.stage.review=Auswertung
category.incident-reports.stage.review.guidance=Nach dem Ende des Vorfalls: die Ursachen, die folgenden Maßnahmen sowie Verlauf, Analyse und Erkenntnisse. Mit dem Abschluss dieser Phase ist die Akte reif für die Prüfung.
category.incident-reports.stage.privacy-assessment.when=personenbezogene Daten betroffen sind
category.incident-reports.stage.notifications.when=personenbezogene Daten betroffen sind oder der Vorfall nach NIS2 erheblich ist
category.incident-reports.deadline.gdpr-art33=Meldung an die Aufsichtsbehörde
category.incident-reports.deadline.gdpr-art33.basis=DSGVO Art. 33: 72 Stunden nach Kenntnis
